# Builds the knowledge pack and the app, and publishes them on GitHub Pages
# (https://sys-bio.github.io/PathwayAnnotator/).
#
# The pack is built from the source data in data/snapshot (BiGG, ChEBI
# release 257, and a digest of the curated BioModels models), so the build
# downloads nothing and every deploy uses the same data until the snapshot
# is refreshed and committed (see data/snapshot/README.md). BioModels could
# not be downloaded here in any case: its server refuses GitHub's build
# machines (HTTP 403).
#
# Before the first run: Settings > Pages > Build and deployment > Source:
# GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (with the WebAssembly target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      - name: Build the knowledge pack from data/snapshot
        run: cargo run --release -p kpack-build -- build --cache data/snapshot

      - name: Build the app
        working-directory: crates/annot-app
        run: trunk build --release --public-url /PathwayAnnotator/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: crates/annot-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
