[workspace]
resolver = "3"
members = [
    "crates/sbml-io",
    "crates/antimony",
    "crates/kpack",
    "crates/kpack-build",
    "crates/annot-engine",
    "crates/annot-model",
    "crates/annot-cli",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
