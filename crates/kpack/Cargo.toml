[package]
name = "kpack"
description = "The annotator's knowledge pack: curated biochemical knowledge as flat, indexed Rust data. No I/O; works in WebAssembly."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
