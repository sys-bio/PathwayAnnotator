[package]
name = "annot-app"
description = "The annotator in the browser: load a model, review suggestions, save annotated SBML. Built with Trunk."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
annot-engine = { path = "../annot-engine" }
annot-model = { path = "../annot-model" }
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
kpack = { path = "../kpack" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["File", "FileList", "FileReader", "HtmlInputElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "DragEvent", "DataTransfer", "Response", "Window", "Document", "Event", "Element", "KeyboardEvent", "MouseEvent", "HtmlElement", "DomRect"] }
