[package]
name = "annot-cli"
description = "The annotator on the command line: the accuracy benchmark, and later batch annotation. Native only."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
annot-engine = { path = "../annot-engine" }
annot-model = { path = "../annot-model" }
clap = { version = "4.6.7", features = ["derive"] }
kpack = { path = "../kpack" }
kpack-build = { path = "../kpack-build" }
sbml-io = { path = "../sbml-io" }
serde_json = "1.0.154"
